name: Refresh NASA content
on:
  workflow_dispatch:
  schedule:
    # 07:30 Asia/Kolkata; newsletter preparation also refreshes defensively.
    - cron: '0 2 * * *'
permissions:
  contents: write
concurrency:
  group: nasa-content-refresh
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python refresh_content.py
        env:
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
      - name: Commit new cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json
          git diff --cached --quiet || (git commit -m "Refresh NASA content" && git push)
